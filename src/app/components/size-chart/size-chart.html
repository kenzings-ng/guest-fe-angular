@if (isApparel()) {
  <div class="overflow-x-auto">
    <table class="w-full min-w-[320px] border-collapse text-left">
      <thead>
        <tr class="border-b border-border">
          <th class="py-2 pr-4 font-medium text-foreground">Size</th>
          <th class="py-2 pr-4 font-medium text-foreground">Chest (cm)</th>
          <th class="py-2 font-medium text-foreground">Waist (cm)</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-border">
        @for (row of rows; track row.size) {
          <tr>
            <td class="py-2 pr-4">{{ row.size }}</td>
            <td class="py-2 pr-4">{{ row.chest }}</td>
            <td class="py-2">{{ row.waist }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
} @else {
  <p>This style runs true to size. If you&rsquo;re between sizes, we recommend sizing up.</p>
}
