<div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto min-w-[300px] max-w-sm rounded border shadow-lg transition-all duration-300 transform translate-y-0 opacity-100"
      [class]="
        toast.type === 'success' ? 'bg-background border-accent text-foreground' :
        toast.type === 'error' ? 'bg-destructive/10 border-destructive text-destructive' :
        'bg-background border-border text-foreground'
      "
    >
      <div class="flex items-start justify-between p-4">
        <div class="flex-1">
          @if (toast.title) {
            <h4 class="font-bold text-sm mb-1">{{ toast.title }}</h4>
          }
          <p class="text-sm opacity-90">{{ toast.message }}</p>
        </div>
        <button
          type="button"
          class="ml-4 opacity-50 hover:opacity-100 transition-opacity"
          (click)="toastService.remove(toast.id)"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  }
</div>
