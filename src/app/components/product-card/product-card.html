<div class="group relative flex flex-col">
  <a [routerLink]="['/products', product().slug]" class="block focus-visible:outline-none">
    <div class="relative aspect-[4/5] overflow-hidden rounded-lg bg-muted">
      <img
        [ngSrc]="product().images[0]"
        [alt]="product().name"
        fill
        [priority]="priority()"
        sizes="(min-width: 1024px) 25vw, (min-width: 640px) 33vw, 50vw"
        class="object-cover transition-opacity duration-200 ease-out"
        [class]="hasSecondImage() ? 'group-hover:opacity-0' : ''"
      />
      @if (hasSecondImage()) {
        <img
          [ngSrc]="product().images[1]"
          [alt]="''"
          fill
          sizes="(min-width: 1024px) 25vw, (min-width: 640px) 33vw, 50vw"
          class="object-cover opacity-0 transition-opacity duration-200 ease-out group-hover:opacity-100"
        />
      }

      @if (product().isNew) {
        <span
          class="small-caps absolute left-3 top-3 rounded-sm bg-background/90 px-2 py-1 text-accent shadow-xs"
        >
          New
        </span>
      }
    </div>

    <div class="mt-4 space-y-1">
      <p class="small-caps text-muted-foreground">{{ product().category }}</p>
      <h3 class="font-display text-lg leading-snug text-foreground">{{ product().name }}</h3>
      <p class="font-display text-base text-foreground">${{ product().price }}</p>
    </div>
  </a>

  <button
    type="button"
    class="small-caps absolute right-3 top-3 flex h-11 w-11 touch-manipulation items-center justify-center rounded-full border border-border bg-background/90 text-foreground opacity-100 shadow-xs transition-all duration-200 ease-out hover:border-accent hover:text-accent focus-visible:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 lg:opacity-0 lg:group-hover:opacity-100 lg:group-focus-within:opacity-100"
    [attr.aria-label]="'Quick add ' + product().name + ' to cart'"
    (click)="onQuickAdd($event)"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path d="M6 2 5 6m13-4 1 4M5 6h14l-1.2 12.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9L5 6Z" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M12 10.5v4M10 12.5h4" stroke-linecap="round" />
    </svg>
  </button>
</div>
