<section class="mx-auto max-w-7xl px-6 py-16 md:py-20">
  <h1 class="text-4xl text-foreground md:text-5xl">Search</h1>

  <div class="relative mt-10 max-w-lg">
    <svg
      class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-muted-foreground"
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" stroke-linecap="round" />
    </svg>
    <label for="search-query" class="sr-only">Search products</label>
    <input
      id="search-query"
      type="search"
      autofocus
      placeholder="Search coats, dresses, tailoring…"
      class="field-input pl-11"
      [value]="query()"
      (input)="onQueryInput($any($event.target).value)"
    />
  </div>

  @if (query().trim().length === 0) {
    <p class="mt-10 text-muted-foreground">Start typing to search the full collection.</p>
  } @else if (results().length === 0) {
    <p class="mt-10 text-muted-foreground">No products match &ldquo;{{ query() }}&rdquo;.</p>
  } @else {
    <div class="mt-10 grid grid-cols-2 gap-x-6 gap-y-12 md:grid-cols-3 md:gap-8 lg:grid-cols-4">
      @for (product of results(); track product.id) {
        <app-product-card [product]="product" (quickAdd)="onQuickAdd($event)" />
      }
    </div>
  }
</section>
