<section class="mx-auto max-w-7xl px-6 py-16 md:py-20">
  <h1 class="text-4xl text-foreground md:text-5xl">Your Wishlist</h1>

  @if (savedProducts().length === 0) {
    <div class="flex flex-col items-center gap-6 py-24 text-center">
      <p class="text-lg text-muted-foreground">Nothing saved yet.</p>
      <app-button variant="primary" routerLink="/products">Explore the Collection</app-button>
    </div>
  } @else {
    <div class="mt-12 grid grid-cols-2 gap-x-6 gap-y-12 md:grid-cols-3 md:gap-8 lg:grid-cols-4">
      @for (product of savedProducts(); track product.id) {
        <app-product-card [product]="product" (quickAdd)="onQuickAdd($event)" />
      }
    </div>
  }
</section>
