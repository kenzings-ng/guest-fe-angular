# Serves the Angular production build. The API is called directly using the
# URL configured in env.js.
#
# Install:
#   sudo cp deploy/nginx/guest-fe.conf /etc/nginx/sites-available/guest-fe.conf
#   sudo ln -s /etc/nginx/sites-available/guest-fe.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # avoid clashing with the default site on :80
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /home/shino/Projects/guest-fe-angular/dist/guest-fe/browser;
    index index.html;

    access_log /var/log/nginx/guest-fe.access.log;
    error_log  /var/log/nginx/guest-fe.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Runtime API configuration. It must be fetched on every page load.
    location = /env.js {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Angular build output is content-hashed — safe to cache aggressively.
    location ~* \.(?:js|css|svg|ico|png|jpg|jpeg|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Angular client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
